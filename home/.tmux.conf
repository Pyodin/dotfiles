set -g mouse on
set -g history-limit 50000

# right click pastes the Windows clipboard, whatever you copied last and wherever.
# win32yank reads it in ~0.1s; --lf strips the CRLFs. -p sends it as a bracketed
# paste, so a multi-line paste lands in the prompt instead of running line by line.
bind -n MouseDown3Pane run -b "$HOME/.local/bin/win32yank.exe -o --lf | tmux load-buffer - && tmux paste-buffer -d -p -t '#{pane_id}'"

# and the other direction: copies made in tmux go out to the Windows clipboard (OSC 52),
# so drag-select here then right-click paste anywhere is one round trip.
set -g set-clipboard on

# tmux owns the mouse, so hold Shift to borrow it back for Windows Terminal's own
# selection - that is the one that works inside k9s and vim. prefix+m hands the
# mouse over wholesale when you want that for a while.
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# quality of life
set -g base-index 1            # windows count from 1, matches the keyboard row
set -g renumber-windows on     # close window 2 of 3, the third becomes 2

